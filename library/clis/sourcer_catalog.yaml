  - id: chrome-devtools-slim
    name: Chrome DevTools MCP (--slim)
    domain: nextjs-react
    domains: [nextjs-react, playwright-qa]
    binding_type: mcp
    url: https://github.com/ChromeDevTools/chrome-devtools-mcp
    probe_kind: none
    mcp_server:
      chrome-devtools:
        command: npx
        args:
          - "-y"
          - "chrome-devtools-mcp@latest"
          - "--slim"
          - "--no-usage-statistics"
          - "--no-performance-crux"
        optionalAutoConnectArgs:
          - "--autoConnect"
    base_signal_quality: 0.89
    base_freshness: 0.90
    base_token_efficiency: 0.86
    description: Slim Chrome DevTools MCP for live console, network, and DOM inspection.
    tags: [browser, devtools, mcp, slim]

