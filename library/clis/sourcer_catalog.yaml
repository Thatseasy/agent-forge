  - id: supabase-mcp2cli
    name: Supabase mcp2cli Wrapper (--toon)
    domain: supabase
    domains: [supabase]
    binding_type: mcp2cli
    url: https://supabase.com/docs/guides/getting-started/mcp
    probe_kind: cli_local
    cli_template:
      command: mcp2cli
      defaultArgs: [--session-start, --toon, --mcp-stdio, "npx -y @supabase/mcp-server-supabase@latest"]
      description: Token-lean mcp2cli --toon wrapper for Supabase MCP schemas on demand
    base_signal_quality: 0.91
    base_freshness: 0.90
    base_token_efficiency: 0.97
    description: Schema-on-demand Supabase MCP access via mcp2cli --toon to avoid context bloat.
    tags: [supabase, mcp2cli, toon]

