[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-forge"
version = "0.1.0"
description = "Local automation pipeline for discovering, gating, benchmarking, refining, QA-testing, and syncing AI agent skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "litellm>=1.50.0",
  "mcp>=1.2.0",
  "openai>=1.50.0",
  "platformdirs>=4.2.0",
  "playwright>=1.52.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
  "scikit-learn>=1.5.0",
  "typer>=0.15.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12",
  "types-defusedxml>=0.7.0.20260504",
  "types-jsonschema>=4.23.0",
]

[project.scripts]
forge = "forge.cli:app"
agent-forge = "forge.cli:app"
agent-forge-mcp = "forge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", ".agents/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "staging", "archive"]
skips = ["B101", "B404", "B603"]
